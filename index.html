<!doctype html>
<html lang="en" data-ui-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>8Burgers — Chino Roces Ave.</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1917'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='system-ui,sans-serif' font-size='16' font-weight='700' fill='%23faf6f0'%3E8B%3C/text%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%images/menu/hero-banner.webp"
      fetchpriority="high"
    />
    <meta name="theme-color" content="#faf6f0" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var saved = window.localStorage.getItem('eight-burgers-theme');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else if (
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
        } catch {
          if (
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            theme = 'dark';
          }
        }
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.dataset.uiTheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
